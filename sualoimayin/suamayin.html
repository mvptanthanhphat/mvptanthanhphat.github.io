<script>
const DATA = {"FIXES":[{"id":"chac-chan","code":"Bộ 1","title":"Sửa chắc chắn","side":"core","summary":"Đủ ba việc mà bản trước còn thiếu: dừng spooler, thay spoolsv.exe + localspl.dll + win32spl.dll bằng bản trong Spooler64, rồi ghi lại ImagePath và mô tả dịch vụ. Nếu bản mới không chạy được, tool tự trả lại file .old.","when":"Spooler không Start, Error 2, Failed to Read Description, hoặc vừa thay file tay mà service vẫn chết.","steps":["Tải bộ sửa, giải nén, chuột phải Sua-Loi-May-In.bat → Run as administrator.","Chọn mục 1. Tool dừng spooler, takeown 3 file, backup thành .old, copy từ thư mục Spooler64.","Ghi lại cấu hình chuẩn: ImagePath trỏ spoolsv.exe, Start = Automatic, phụ thuộc RPCSS và http.","Đặt RpcAuthnLevelPrivacyEnabled = 0, mở File and Printer Sharing, xóa hàng đợi (không đụng driver).","Start Print Spooler. Nếu không lên, tool copy trả file .old rồi start lại.","Khi đã RUNNING, đợi khoảng 2 phút rồi kết nối lại máy in."],"commands":["net stop spooler","taskkill /F /IM spoolsv.exe","takeown /A /F C:\\Windows\\System32\\spoolsv.exe","takeown /A /F C:\\Windows\\System32\\localspl.dll","takeown /A /F C:\\Windows\\System32\\win32spl.dll","copy /y Spooler64\\spoolsv.exe C:\\Windows\\System32\\spoolsv.exe","copy /y Spooler64\\localspl.dll C:\\Windows\\System32\\localspl.dll","copy /y Spooler64\\win32spl.dll C:\\Windows\\System32\\win32spl.dll","reg add HKLM\\SYSTEM\\CurrentControlSet\\Services\\Spooler /v ImagePath /t REG_EXPAND_SZ /d \"%SystemRoot%\\System32\\spoolsv.exe\" /f","reg add HKLM\\SYSTEM\\CurrentControlSet\\Services\\Spooler /v Description /t REG_SZ /d \"@%systemroot%\\system32\\spoolsv.exe,-2\" /f","reg add HKLM\\SYSTEM\\CurrentControlSet\\Control\\Print /v RpcAuthnLevelPrivacyEnabled /t REG_DWORD /d 0 /f","sc config Spooler start= auto","sc start Spooler"],"caution":"Ba file trong bộ là Windows 10 64-bit, bản 19041. Trên Windows 11 hãy để tool chạy: nó tự rollback nếu spooler không lên. Không dùng bộ này trên máy 32-bit.","kit":"Menu 1"},{"id":"files","code":"Spooler64","title":"Chỉ thay 3 file","side":"core","summary":"Đúng hướng dẫn dán tay: dừng dịch vụ, nhường quyền, đổi file cũ thành .old, chép 3 file Spooler64 vào System32, rồi Start.","when":"File spoolsv.exe mất hoặc hỏng, services báo Error 2: The system cannot find the file specified.","steps":["Run as administrator → menu 2.","Kiểm tra log: mỗi file phải ghi «Đã thay» và đúng số byte.","Vào services.msc → Print Spooler → Start. Đợi khoảng 2 phút."],"commands":["net stop spooler","taskkill /F /IM spoolsv.exe","ren C:\\Windows\\System32\\spoolsv.exe spoolsv.exe.old","ren C:\\Windows\\System32\\localspl.dll localspl.dll.old","ren C:\\Windows\\System32\\win32spl.dll win32spl.dll.old","copy /y .\\Spooler64\\* C:\\Windows\\System32\\","sc start Spooler"],"caution":"Đổi tên mà không copy file mới sẽ làm spooler mất hẳn. Dùng menu 2, đừng chỉ chạy đoạn ren.","kit":"Menu 2"},{"id":"error2","code":"Error 2","title":"Description lỗi code 2","side":"core","summary":"Service vẫn trỏ sai đường dẫn hoặc mất Description nên services.msc báo Failed to Read Description, Error Code 2. Mục này chỉ sửa registry, không ghi đè file đang tốt.","when":"spoolsv.exe còn trên đĩa, header MZ đúng, nhưng bấm Start vẫn Error 2 hoặc mô tả dịch vụ không đọc được.","steps":["Menu 3. Tool xuất backup registry ra %TEMP% trước khi ghi.","Đặt ImagePath, DisplayName, Description, Type 272, Start Automatic, ObjectName LocalSystem.","DependOnService = RPCSS và http. Bật lại HTTP nếu đang Disabled.","Start spooler và đọc lại sc query."],"commands":["sc qc Spooler","reg add HKLM\\SYSTEM\\CurrentControlSet\\Services\\Spooler /v ImagePath /t REG_EXPAND_SZ /d \"%SystemRoot%\\System32\\spoolsv.exe\" /f","reg add HKLM\\SYSTEM\\CurrentControlSet\\Services\\Spooler /v Start /t REG_DWORD /d 2 /f","reg add HKLM\\SYSTEM\\CurrentControlSet\\Services\\Spooler /v Description /t REG_SZ /d \"@%systemroot%\\system32\\spoolsv.exe,-2\" /f","sc config Spooler depend= RPCSS/http","sc config Spooler start= auto","sc start Spooler"],"kit":"Menu 3"},{"id":"11b","code":"0x0000011b","title":"PrintNightmare","side":"server","summary":"Windows chặn RPC in mạng sau bản vá PrintNightmare. Máy trạm thêm máy in thì báo 0x0000011b.","when":"Thêm máy in mạng được một thời gian, sau update Windows thì cả hai máy đều 0x11b.","steps":["Chạy trên cả máy chủ lẫn máy trạm.","RpcAuthnLevelPrivacyEnabled = 0, bật RPC qua named pipe và TCP.","Restart Print Spooler."],"commands":["reg add \"HKLM\\SYSTEM\\CurrentControlSet\\Control\\Print\" /v RpcAuthnLevelPrivacyEnabled /t REG_DWORD /d 0 /f","reg add \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\RPC\" /v RpcOverNamedPipes /t REG_DWORD /d 1 /f","reg add \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\RPC\" /v RpcOverTcp /t REG_DWORD /d 1 /f","net stop spooler & net start spooler"],"kit":"Menu 4"},{"id":"7c","code":"0x0000007c","title":"RPC server unavailable","side":"server","summary":"Cùng nhóm khóa RPC với 0x11b. Máy chủ không nhận kết nối in.","when":"Kết nối \\\\máy-chủ\\máy-in báo 0x0000007c.","steps":["Chạy menu 4 trên máy đang chia sẻ máy in.","Thử lại từ máy trạm sau khi spooler đã RUNNING."],"commands":["reg add \"HKLM\\SYSTEM\\CurrentControlSet\\Control\\Print\" /v RpcAuthnLevelPrivacyEnabled /t REG_DWORD /d 0 /f","net stop spooler & net start spooler"],"kit":"Menu 4"},{"id":"6d9","code":"0x000006d9","title":"Firewall service tắt","side":"server","summary":"Chia sẻ máy in cần Windows Firewall đang chạy. Tắt hết firewall thì sharing chết với 0x6d9.","when":"Bật chia sẻ xong nhưng máy khác không thấy, hoặc lỗi 0x000006d9.","steps":["Đặt MpsSvc (Windows Firewall) thành Automatic và Start.","Bật nhóm File and Printer Sharing và Network Discovery theo mã ngôn ngữ, khỏi phụ thuộc tên tiếng Việt."],"commands":["sc config MpsSvc start= auto","sc start MpsSvc","netsh advfirewall firewall set rule group=\"@FirewallAPI.dll,-28502\" new enable=Yes","netsh advfirewall firewall set rule group=\"@FirewallAPI.dll,-32752\" new enable=Yes"],"kit":"Menu 5"},{"id":"share","code":"Share","title":"Chia sẻ mọi máy in","side":"server","summary":"Đặt Shared = true và tên share ngắn, không dấu cách, tối đa 12 ký tự.","when":"Máy in local in được nhưng máy khác không có đường dẫn \\\\IP\\TênShare.","steps":["Menu 6. Đọc log: mỗi máy in một dòng tên share.","Trên máy trạm kết nối \\\\IP-máy-chủ\\TênShare."],"commands":["rundll32 printui.dll,PrintUIEntry /Xs /n \"Ten May In\" Shared TRUE ShareName \"TenMayIn\""],"kit":"Menu 6"},{"id":"bc4","code":"0x00000bc4","title":"RPC endpoint","side":"client","summary":"Máy trạm không tới được endpoint spooler. Sửa khóa RPC rồi restart spooler.","when":"Thêm máy in mạng báo 0x00000bc4.","steps":["Menu 4 trên máy trạm.","Nếu vẫn lỗi, chạy mục Sửa chắc chắn trên máy chủ."],"commands":["reg add \"HKLM\\SYSTEM\\CurrentControlSet\\Control\\Print\" /v RpcAuthnLevelPrivacyEnabled /t REG_DWORD /d 0 /f","net stop spooler & net start spooler"],"kit":"Menu 4"},{"id":"709","code":"0x00000709","title":"Không đặt được mặc định","side":"client","summary":"Xóa giá trị Device cũ, bật LegacyDefaultPrinterMode, cấp quyền cho khóa Windows của user hiện tại.","when":"Chọn máy in mặc định không được, lỗi 0x00000709.","steps":["Menu 7. Xong thì vào Settings đặt lại máy in mặc định bằng tay.","Không cần xóa driver."],"commands":["reg delete \"HKCU\\Software\\Microsoft\\Windows NT\\CurrentVersion\\Windows\" /v Device /f","reg add \"HKCU\\Software\\Microsoft\\Windows NT\\CurrentVersion\\Windows\" /v LegacyDefaultPrinterMode /t REG_DWORD /d 1 /f","net stop spooler & net start spooler"],"kit":"Menu 7"},{"id":"policy","code":"Policy","title":"Point and Print bị chặn","side":"client","summary":"Gỡ chính sách cấm cài driver máy in từ máy chủ (0x00004005 và hộp thoại policy).","when":"Kết nối được share nhưng Windows chặn cài driver, hoặc Access Denied kèm policy.","steps":["Menu 8 trên máy trạm.","Kết nối lại \\\\IP\\TênShare. Nếu hỏi mật khẩu, thêm credential trước."],"commands":["reg add \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\PointAndPrint\" /v RestrictDriverInstallationToAdministrators /t REG_DWORD /d 0 /f","reg add \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\PointAndPrint\" /v NoWarningNoElevationOnInstall /t REG_DWORD /d 1 /f","reg add \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\PointAndPrint\" /v UpdatePromptSettings /t REG_DWORD /d 2 /f","reg add \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\PointAndPrint\" /v InForest /t REG_DWORD /d 0 /f"],"kit":"Menu 8"},{"id":"4005","code":"0x00004005","title":"Access denied","side":"client","summary":"Sai user/mật khẩu máy chủ, hoặc policy Point and Print. Tool không lưu mật khẩu giúp — bạn gõ cmdkey.","when":"0x00004005 khi mở \\\\máy-chủ\\máy-in.","steps":["Chạy Policy (menu 8) trên máy trạm.","cmdkey /add:IP /user:TEN /pass:MATKHAU với tài khoản có quyền trên máy chủ.","Thử lại đường dẫn share."],"commands":["cmdkey /list","cmdkey /add:192.168.1.10 /user:MAYCHU\\ten /pass:matkhau","cmdkey /delete:192.168.1.10"],"caution":"Đừng gửi mật khẩu vào log hay chép vào file. Gõ trực tiếp trên máy trạm.","kit":"Menu 8 + cmdkey"},{"id":"3e3","code":"0x000003e3","title":"Impersonation","side":"client","summary":"Lỗi mạo danh khi in qua mạng. Tắt forceguest và cho phép guest auth không an toàn trên workgroup.","when":"0x000003e3, hoặc máy trạm thấy share nhưng không in được vì không cùng domain.","steps":["Menu 9.","Hai máy nên cùng tên workgroup.","Restart spooler."],"commands":["reg add \"HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\" /v forceguest /t REG_DWORD /d 0 /f","reg add \"HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanWorkstation\\Parameters\" /v AllowInsecureGuestAuth /t REG_DWORD /d 1 /f","net stop spooler & net start spooler"],"kit":"Menu 9"},{"id":"bcb","code":"0x00000bcb","title":"Không thấy tài nguyên mạng","side":"client","summary":"Dịch vụ Workstation hoặc Server đang tắt nên không mở được đường dẫn UNC.","when":"0x m phá mạng.","when":"Ping được nhưng không in, lỗi 0x00000040.","steps":["Menu 5. Giữ dịch vụ Windows Firewall đang chạy."],"commands":["netsh advfirewall firewall set rule group=\"@FirewallAPI.dll,-28502\" new enable=Yes","netsh advfirewall firewall set rule group=\"@FirewallAPI.dll,-32752\" new enable=Yes"],"kit":"Menu 5"},{"id":"771","code":"0x00000771","title":"Máy in đang offline","side":"both","summary":"Đưa các máy in WMI đang WorkOffline về online, rồi xóa hàng đợi.","when":"Máy in mờ, trạng thái Offline, lỗi 0x00000771 dù cáp và nguồn vẫn có.","steps":["Menu 14.","Nếu là máy in USB Canon, rút cáp 10 giây rồi cắm lại."],"commands":["powershell -Command \"Get-WmiObject Win32_Printer | Where-Object WorkOffline | ForEach-Object { $_.WorkOffline = $false; $_.Put() }\"","net stop spooler","del /q /f C:\\Windows\\System32\\spool\\PRINTERS\\*.*","net start spooler"],"kit":"Menu 14"},{"id":"3eb","code":"0x000003eb","title":"Printing not supported","side":"client","summary":"Bật tính năng Internet Printing Client và LPR Port Monitor. LPD chỉ có trên bản Pro.","when":"0x000003eb khi thêm cổng LPR hoặc máy in IPP.","steps":["Menu 15. DISM có thể chạy vài phút. Không bắt buộc khởi động lại ngay."],"commands":["dism /Online /Enable-Feature /FeatureName:Printing-Foundation-InternetPrinting-Client /NoRestart","dism /Online /Enable-Feature /FeatureName:Printing-LPRPortMonitor /NoRestart"],"kit":"Menu 15"},{"id":"canon","code":"Canon","title":"Canon LBP 2900 / 3300","side":"shop","summary":"Xóa USB Monitor và các cổng CNBJNP cũ, dọn hàng đợi, giữ nguyên driver. Rút cáp USB rồi cắm lại.","when":"Communication Error, Canon LBP nhận cổng nhưng không in.","steps":["Menu 16.","Rút USB, đợi 10 giây, cắm vào đúng cổng sau máy.","Nếu Windows hỏi driver, chọn driver LBP đang có — đừng cài đè bản lạ."],"commands":["net stop spooler","taskkill /F /IM spoolsv.exe","reg delete \"HKLM\\SYSTEM\\CurrentControlSet\\Control\\Print\\Monitors\\USB Monitor\" /f","net start spooler"],"kit":"Menu 16"},{"id":"ports","code":"Ports","title":"Xóa cổng TCP/IP hỏng","side":"shop","summary":"Chỉ xóa cổng có địa chỉ IP hoặc đường UNC. Giữ USB, COM, LPT, FILE:, NUL:.","when":"Cổng Standard TCP/IP trùng, sai IP, máy in mạng thêm không được.","steps":["Menu 17. Đọc tên cổng bị xóa trong log.","Tạo lại cổng trong Print Server Properties nếu vẫn cần in mạng."],"commands":["reg query \"HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Ports\""],"caution":"Đừng xóa cả khóa Ports. Chỉ xóa từng giá trị cổng mạng hỏng.","kit":"Menu 17"},{"id":"unlock","code":"Unlock","title":"Mở khóa chia sẻ","side":"server","summary":"Gỡ DisableHTTPPrinting, DisablePrinterAdmin và hạn chế Point and Print phía máy chủ.","when":"Máy chủ không bật được Share this printer, nút mờ hoặc policy chặn.","steps":["Menu 18.","Vào Properties máy in → Sharing → Share this printer."],"commands":["reg add \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\" /v DisableHTTPPrinting /t REG_DWORD /d 0 /f","reg add \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\" /v DisablePrinterAdmin /t REG_DWORD /d 0 /f"],"kit":"Menu 18"},{"id":"diag","code":"Log","title":"Chẩn đoán trước khi sửa","side":"shop","summary":"In ra phiên bản Windows, spooler RUNNING hay STOPPED, ImagePath, kích thước 3 file, và khóa RPC. Chưa sửa gì.","when":"Chưa rõ máy đang lỗi file mất hay chỉ lỗi chính sách.","steps":["Menu 19. Chụp lại cửa sổ hoặc mở %TEMP%\\SuaLoiMayIn.log.","File thiếu hoặc không phải MZ → chạy Sửa chắc chắn. File còn, ImagePath sai → menu 3."],"commands":["sc query Spooler","sc qc Spooler","dir C:\\Windows\\System32\\spoolsv.exe"],"kit":"Menu 19"}],"FILES":[{"name":"spoolsv.exe","role":"Dịch vụ Print Spooler","version":"10.0.19041.1237"},{"name":"localspl.dll","role":"Local Spooler / winprint","version":"10.0.19041.1237"},{"name":"win32spl.dll","role":"In qua mạng (LanMan)","version":"10.0.19041.1266"}],"SIDES":[{"id":"all","label":"Tất cả"},{"id":"core","label":"Chắc chắn"},{"id":"server","label":"Máy chủ"},{"id":"client","label":"Máy trạm"},{"id":"both","label":"Cả hai"},{"id":"shop","label":"Xưởng"}],"SIDE_LABEL":{"core":"Việc làm trước","server":"Máy đang chia sẻ","client":"Máy đang kết nối","both":"Chạy trên cả hai máy","shop":"Hàng đợi, cổng, Canon"}};
const KIT = "SuaLoiMayIn-Full.zip";
const fold = (s) => s.toLowerCase().replace(/0x0+/g, "0x");
let side = "all";
let selected = DATA.FIXES[0].id;
let copied = false;
let done = {};
try { done = JSON.parse(localStorage.getItem("mayin-done") || "{}"); } catch (e) {}

function save() { localStorage.setItem("mayin-done", JSON.stringify(done)); }
function visible() {
  const q = fold(document.getElementById("q").value.trim());
  return DATA.FIXES.filter((fix) => {
    if (side !== "all" && fix.side !== side) return false;
    if (!q) return true;
    return fold(fix.code + " " + fix.title + " " + fix.summary + " " + fix.when).includes(q);
  });
}
function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&":"&", "<":"<", ">":">" }[c]));
}
function render() {
  const chips = document.getElementById("chips");
  chips.innerHTML = DATA.SIDES.map((item) =>
    '<button type="button" class="chip' + (item.id === side ? " on" : "") + '" data-side="' + item.id + '">' + esc(item.label) + "</button>"
  ).join("");
  const items = visible();
  const list = document.getElementById("list");
  list.innerHTML = items.length ? items.map((fix) =>
    '<li><button type="button" class="item' + (fix.id === selected ? " on" : "") + '" data-id="' + fix.id + '">' +
    '<span class="code">' + esc(fix.code) + "</span><span><b>" + esc(fix.title) + "</b><small>" + esc(DATA.SIDE_LABEL[fix.side]) + "</small></span></button></li>"
  ).join("") : '<li class="empty">Không có mục khớp. Thử Error 2 hoặc Canon.</li>';
  const fix = DATA.FIXES.find((f) => f.id === selected) || items[0] || DATA.FIXES[0];
  selected = fix.id;
  const steps = fix.steps.map((step, i) => {
    const key = fix.id + ":" + i;
    const on = !!done[key];
    return '<li><button type="button" class="step' + (on ? " on" : "") + '" data-step="' + key + '"><i class="box">✓</i><span><span class="code">' + (i + 1) + "</span> " + esc(step) + "</span></button></li>";
  }).join("");
  const files = fix.id === "chac-chan" ? (
    "<h3>Ba file đi kèm trong Spooler64</h3><p class='lead'>Bản Microsoft gốc, kiến trúc x64. Tool kiểm tra chữ MZ và SHA-256 trước khi ghi đè.</p><table><thead><tr><th>File</th><th>Vai trò</th><th>Phiên bản</th></tr></thead><tbody>" +
    DATA.FILES.map((f) => "<tr><td class='mono'>" + esc(f.name) + "</td><td>" + esc(f.role) + "</td><td class='mono'>" + esc(f.version) + "</td></tr>").join("") +
    "</tbody></table>"
  ) : "";
  document.getElementById("detail").innerHTML =
    '<p class="meta">' + esc(fix.code) + " · " + esc(fix.kit) + "</p>" +
    "<h2>" + esc(fix.title) + "</h2>" +
    '<p class="lead">' + esc(fix.summary) + "</p>" +
    '<dl class="grid"><div class="card"><dt>Khi nào dùng</dt><dd>' + esc(fix.when) + "</dd></div>" +
    '<div class="card"><dt>Trong bộ tải về</dt><dd>Giải nén, chạy <span class="mono">Sua-Loi-May-In.bat</span> bằng quyền Administrator, rồi ' + esc(fix.kit.toLowerCase()) + ".</dd></div></dl>" +
    (fix.caution ? '<p class="warn">' + esc(fix.caution) + "</p>" : "") +
    "<h3>Thứ tự trên máy Windows</h3><ol>" + steps + "</ol>" +
    '<div class="row"><h3>Lệnh tương đương</h3><button type="button" class="copy" id="copy">' + (copied ? "Đã chép" : "Chép lệnh") + "</button></div>" +
    "<pre id='cmds'>" + esc(fix.commands.join("\n")) + "</pre>" + files;
}
document.getElementById("q").addEventListener("input", render);
document.body.addEventListener("click", async (event) => {
  const sideBtn = event.target.closest("[data-side]");
  if (sideBtn) { side = sideBtn.dataset.side; copied = false; render(); return; }
  const item = event.target.closest("[data-id]");
  if (item) { selected = item.dataset.id; copied = false; render(); return; }
  const step = event.target.closest("[data-step]");
  if (step) { done[step.dataset.step] = !done[step.dataset.step]; save(); render(); return; }
  if (event.target.closest("#copy")) {
    const text = document.getElementById("cmds").textContent;
    try { await navigator.clipboard.writeText(text); } catch (e) {}
    copied = true; render();
  }
});
render();
</script>
