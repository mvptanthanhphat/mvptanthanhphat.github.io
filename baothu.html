<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bao thư — Tân Thành Phát</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 229mm 162mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: #e8e2da; }
  body { font-family: "Be Vietnam Pro", sans-serif; display: flex; justify-content: center; padding: 8mm 0; }
  .face {
    width: 229mm; height: 162mm; overflow: hidden; position: relative;
    background: #f3eee6; display: flex; flex-direction: column;
    box-shadow: 0 2mm 6mm rgba(18,36,95,0.16);
  }
  .head {
    display: flex; align-items: center; gap: 6mm;
    padding: 7mm 12mm 6mm; background: #f3eee6;
  }
  .head img { width: 24mm; height: 24mm; object-fit: contain; flex-shrink: 0; }
  .word { flex: 1; text-align: center; padding: 1mm 4mm; }
  .kicker { color: #7a1028; font-size: 3.2mm; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.4; }
  .brand { font-family: Oswald, sans-serif; color: #7a1028; font-size: 11mm; letter-spacing: 0.04em; line-height: 1.12; margin-top: 2.4mm; }
  .tag { margin-top: 2.6mm; font-size: 3.4mm; font-weight: 700; color: #7a1028; line-height: 1.4; }
  .stripe { height: 2mm; background: #d94820; flex-shrink: 0; }
  .body { flex: 1; padding: 6mm 14mm 5mm; display: flex; flex-direction: column; justify-content: space-between; }
  .field + .field { margin-top: 0; }
  .to { color: #7a1028; font-weight: 800; font-size: 3.2mm; letter-spacing: 0.14em; }
  .line { height: 12mm; border-bottom: 0.45mm solid #b56b58; }
  .hint { margin-top: 0; color: #12245f; font-size: 3.5mm; font-weight: 700; }
  .foot {
    background: #12245f; color: white; display: flex; align-items: center; gap: 5mm;
    padding: 4mm 8mm 4mm 10mm;
  }
  .addr { flex: 1; font-size: 3.3mm; font-weight: 600; line-height: 1.4; }
  .addr b { display: block; color: #ffe0b5; font-size: 2.6mm; letter-spacing: 0.1em; margin-bottom: 0.6mm; }
  .call { background: #c83b16; color: white; border-radius: 2.2mm; padding: 2mm 4mm 1.8mm; text-align: center; }
  .call .lbl { font-size: 2.4mm; letter-spacing: 0.14em; font-weight: 800; }
  .call .num { font-family: Oswald, sans-serif; font-size: 8mm; line-height: 1; margin-top: 0.4mm; }
  .call .sub { font-size: 2.4mm; font-weight: 600; margin-top: 0.4mm; }
  .qrbox { background: white; padding: 1mm; border-radius: 1.2mm; }
  .qrbox img { width: 16mm; height: 16mm; display: block; }
  .qrcap { color: #ffe0b5; font-size: 2.2mm; text-align: center; font-weight: 700; margin-top: 0.6mm; }
  @media print {
    html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
    body { display: block; }
    .face { box-shadow: none; }
  }
</style>
