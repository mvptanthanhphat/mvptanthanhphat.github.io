<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hóa đơn sỉ - MiMi Shop Hoa Lụa</title>
<style>
  :root {
    --bg: #f6f1e8; --surface: #fffdf8; --surface-2: #f3ebdf; --ink: #1c1915;
    --muted: #6f655c; --primary: #7c3527; --primary-fg: #fff8f3; --line: #e4d5c3;
    --gold: #a68456; --ok: #1f7a4d; --ok-bg: #e7f6ee; --warn: #9a5416; --warn-bg: #fff4e8;
    --danger: #9b2c2c; --danger-bg: #fdecec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.45 "Be Vietnam Pro", "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px 16px 88px; }
  header.top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { color: var(--primary); font-size: 13px; font-weight: 650; text-decoration: none; }
  .status { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--danger-bg); color: var(--danger); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
  .tabs button { height: 44px; border: 0; border-radius: 12px; background: transparent; padding: 0 14px; font-weight: 650; color: var(--muted); white-space: nowrap; }
  .tabs button.on { background: var(--primary); color: var(--primary-fg); }
  .grid { display: grid; gap: 12px; }
  .grid > *, .row > div { min-width: 0; }
  .sel { max-width: 100%; }
  @media (min-width: 900px) {
    .sell, .quote { grid-template-columns: minmax(0,1fr) 340px; align-items: start; }
    .sell > aside.card, .quote > aside.card { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow: auto; }
  }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .pad { padding: 12px; }
  .field, .area, .sel {
    width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); padding: 0 12px;
  }
  .area { height: auto; min-height: 52px; padding: 8px 12px; }
  label.lbl { display: block; font-size: 13px; color: var(--muted); font-weight: 650; margin: 8px 0 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > .field, .row > .sel { flex: 1 1 140px; width: auto; min-width: 0; }
  .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { height: 44px; border: 0; border-radius: 12px; padding: 0 14px; font-weight: 700; background: var(--primary); color: var(--primary-fg); }
  .btn.soft { background: var(--surface-2); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.bad { background: var(--danger); color: var(--primary-fg); }
  .list { max-height: 68vh; overflow: auto; }
  .item, .order { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 12px; }
  .item img, .ph { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; background: var(--surface-2); flex: none; }
  .grow { min-width: 0; flex: 1; }
  .name { font-weight: 700; }
  .meta { color: var(--muted); font-size: 13px; }
  .right { text-align: right; }
  .cart-line { background: var(--surface-2); border-radius: 12px; padding: 10px; margin-top: 8px; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-bottom: 12px; }
  @media (min-width: 800px) { .stats { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 14px; padding: 12px; }
  .stat b { display: block; font-size: 18px; margin-top: 2px; }
  .hidden { display: none !important; }
  .overlay { position: fixed; inset: 0; background: rgba(28,25,21,.45); z-index: 30; overflow: auto; padding: 12px; }
  .sheet { max-width: 860px; margin: 0 auto; background: var(--surface); border-radius: 16px; padding: 14px; max-height: calc(100vh - 24px); overflow: auto; }
  .hits { max-height: 200px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; margin-top: 6px; background: var(--surface); }
  .toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--primary-fg); border-radius: 12px; padding: 10px 14px; z-index: 50; max-width: 90vw; }
  .invoice-paper { background: #fffdf8; color: #2b211c; border: 1.5px solid #c4a36a; border-radius: 18px; padding: 18px 18px 14px; margin: 0 auto; }
  .inv-frame { background: #fffdf8; border: 1.5px solid #e4c994; border-radius: 26px; padding: 7px; margin: 8px auto; }
  .invoice-paper[data-paper="a4"] { width: min(190mm, 100%); }
  .invoice-paper[data-paper="a6"] { width: min(105mm, 100%); font-size: 11px; padding: 8px; }
  .invoice-paper[data-paper="a7"] { width: min(74mm, 100%); font-size: 8.5px; padding: 6px; }
  .invoice-paper h2 { text-align: center; color: #7c3527; letter-spacing: .08em; border: 0; padding: 2px 0 0; margin: 0; font-size: 22px; }
  .invoice-paper table { width: 100%; border-collapse: collapse; border: 1.5px solid #7a5436; }
  .invoice-paper th, .invoice-paper td { border: 1px solid #b08968; padding: 5px 7px; vertical-align: middle; }
  .invoice-paper th { background: #f6efe4; color: #5c3a28; font-size: 12px; font-weight: 700; text-align: center; }
  .num { text-align: right; white-space: nowrap; }
  .ctr { text-align: center; }
  .inv-logo { width: 92px; height: 92px; object-fit: contain; background: #fff; flex: none; }
  .headrow { display: flex; gap: 14px; align-items: center; }
  .inv-shop { flex: 1; text-align: center; }
  .inv-shop h3 { margin: 0 0 4px; color: #7c3527; font-size: 26px; letter-spacing: -.02em; }
  .inv-shop p { margin: 0; color: #5c5148; font-size: 13px; line-height: 1.45; }
  .inv-rule { border: 0; border-top: 1.5px solid #7c3527; margin: 12px 0; }
  .inv-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; background: #fbf7f1; border: 1px solid #e4d3c0; border-radius: 14px; padding: 12px 14px; }
  .inv-foot { display: grid; grid-template-columns: 1.15fr .85fr; gap: 12px; margin-top: 12px; align-items: start; }
  .paygrid td.k { color: #5c5148; }
  .paygrid tr.grand td { background: #f8f1e7; font-weight: 800; color: #7c3527; }
  .paygrid tr.neg td { color: #9b2c2c; font-weight: 800; }
  .qr { display: flex; gap: 10px; align-items: center; margin-top: 10px; border: 1px solid #e4d3c0; border-radius: 14px; padding: 8px; background: #fff; }
  .qr img { width: 112px; height: 112px; object-fit: contain; background: white; border: 1px solid #efe4d6; }
  .thanks { text-align: center; color: #6f655c; font-size: 13px; margin: 14px 0 2px; line-height: 1.55; }
  .quote-paper { width: min(190mm, 100%); margin: 0 auto; background: #fbf8f3; color: #1c1915; border-radius: 22px; padding: 22px 22px 18px; position: relative; box-shadow: 0 10px 30px rgba(124,53,39,.08); }
  .quote-paper:before { content: ""; position: absolute; inset: 8px; border: 1px solid #e4c994; border-radius: 16px; pointer-events: none; }
  .quote-band { height: 8px; border-radius: 99px; background: linear-gradient(90deg, #7c3527, #a68456 55%, #f3e2c4); margin-bottom: 16px; }
  .quote-kicker { letter-spacing: .28em; color: #a68456; font-size: 12px; font-weight: 700; text-align: center; }
  .quote-paper h2 { text-align: center; color: #7c3527; letter-spacing: .18em; font-size: 32px; margin: 4px 0 0; }
  .quote-lead { text-align: center; color: #6f655c; margin: 6px 0 14px; }
  .quote-who { background: #fff; border: 1px solid #eadfce; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
  .quote-paper table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  .quote-paper th { background: #7c3527; color: #fff8f3; font-size: 12px; letter-spacing: .04em; padding: 8px; }
  .quote-paper td { border-bottom: 1px solid #eadfce; padding: 8px; background: #fff; }
  .quote-sum { margin-top: 14px; margin-left: auto; width: min(280px, 100%); background: #fff; border: 1px solid #eadfce; border-radius: 14px; overflow: hidden; }
  .quote-sum div { display: flex; justify-content: space-between; padding: 8px 12px; }
  .quote-sum .vat { background: #fff6ea; color: #7c3527; font-weight: 700; }
  .quote-sum .grand { background: #7c3527; color: #fff8f3; font-weight: 800; font-size: 16px; }
  .quote-note { margin-top: 14px; color: #6f655c; font-size: 13px; line-height: 1.55; }
  .invoice-paper[data-paper="a6"] .inv-logo { width: 64px; height: 64px; }
  .invoice-paper[data-paper="a6"] .inv-shop h3, .invoice-paper[data-paper="a7"] .inv-shop h3 { font-size: 16px; }
  .invoice-paper[data-paper="a6"] .inv-web, .invoice-paper[data-paper="a7"] .inv-web { display: none; }
  .invoice-paper[data-paper="a7"] .inv-logo { width: 40px; height: 40px; }
  .invoice-paper[data-paper="a7"] .inv-shop h3 { font-size: 13px; }
  .invoice-paper[data-paper="a7"] .qr { display: none; }
  @media (max-width: 640px) {
    .inv-meta, .inv-foot { grid-template-columns: 1fr; }
    .inv-shop h3 { font-size: 20px; }
  }
  .dock { display: none; }
  .zalo-shot { width: min(100%, 420px); height: auto; border-radius: 12px; background: white; box-shadow: 0 8px 28px rgba(28,25,21,.12); }
  @media (max-width: 899px) {
    .list { max-height: calc(100vh - 250px); }
    .dock.show { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 8px; align-items: center; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .sell > aside.card, .quote > aside.card { display: none; }
    .sell > aside.card.open, .quote > aside.card.open { display: block; position: fixed; z-index: 25; left: 8px; right: 8px; top: 64px; bottom: 76px; overflow: auto; }
  }
  @media print {
    body * { visibility: hidden; }
    #printSheet, #printSheet * { visibility: visible; }
    #printSheet { position: absolute; inset: 0; background: white; }
    .no-print { display: none !important; }
    .invoice-paper[data-paper="a4"], .quote-paper { width: 210mm !important; min-height: 297mm; box-sizing: border-box; border-radius: 0; box-shadow: none; }
    .inv-frame { border: 0; padding: 0; }
    tr, .qr { break-inside: avoid; }
  }
</style>

const $ = (id) => document.getElementById(id);
const money = (n) => Math.round(Number(n) || 0).toLocaleString("vi-VN");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fold = (s) => String(s || "").normalize("NFD").replace(/\p{M}/gu, "").replace(/đ/g, "d").toLowerCase();
const hit = (blob, q) => { const f = fold(q).trim(); if (!f) return true; const b = fold(blob); return f.split(/\s+/).every((w) => b.includes(w)); };
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), 2800);
}
function vnParts(d) {
  const bag = {};
  new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Ho_Chi_Minh", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(d).forEach((part) => { bag[part.type] = part.value; });
  if (bag.hour === "24") bag.hour = "00";
  return bag;
}
function when(v) {
  if (!v) return "";
  const d = v.toDate ? v.toDate() : v.seconds ? new Date(v.seconds * 1000) : new Date(v);
  if (Number.isNaN(d.getTime())) return "";
  const b = vnParts(d);
  return `${b.day}/${b.month}/${b.year} ${b.hour}:${b.minute}`;
}
function todayKey() {
  const b = vnParts(new Date());
  return `${b.year}${b.month}${b.day}`;
}
function nextCode() {
  const prefix = "HD" + todayKey();
  let max = 0;
  orders.forEach((o) => {
    const id = String(o.orderId || "");
    if (!id.startsWith(prefix)) return;
    const n = parseInt(id.slice(prefix.length), 10);
    if (n > max) max = n;
  });
  return prefix + String(max + 1).padStart(4, "0");
}
function priceOf(p) { return Number(p.wholesale_price || p.price || 0); }
function imgOf(p) { return p.image || p.image_url || ""; }

function watch() {
  db.collection("wholesale_products").onSnapshot((snap) => {
    products = snap.docs.map((d) => ({ ...d.data(), docId: d.id })).sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "vi"));
    cloudOk = true;
    cloud = "Firebase esomar-vnn";
    paint();
  }, (err) => { cloudOk = false; cloud = "Không đọc được hàng: " + err.message; paint(); });

  const applyOrders = (snap) => {
    orders = snap.docs.map((d) => ({ ...d.data(), docId: d.id, orderId: d.data().orderId || d.id }));
    orders.sort((a, b) => (b.localTimestamp || 0) - (a.localTimestamp || 0) || String(b.orderId).localeCompare(String(a.orderId)));
    paint();
  };
  db.collection("wholesale_orders").orderBy("createdAt", "desc").limit(400).onSnapshot(applyOrders, () => {
    db.collection("wholesale_orders").limit(400).onSnapshot(applyOrders, (err) => toast(err.message));
  });
  db.collection("access_codes").onSnapshot((snap) => {
    codes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    codes.sort((a, b) => String(a.clientName || "").localeCompare(String(b.clientName || ""), "vi"));
    if (tab === "codes" || tab === "sell" || tab === "quote") paint();
  }, (err) => toast("Mã khách: " + err.message));
}

function paint() {
  $("cloudPill").textContent = cloud;
  $("cloudPill").className = "pill " + (cloudOk ? "ok" : "warn");
  const open = orders.filter((o) => o.status === "new").length;
  $("countPill").textContent = `${products.length} hàng · ${orders.length} đơn · ${open} chờ chốt`;
  const tabs = [["sell", "Bán"], ["quote", "Báo giá"], ["orders", "Hóa đơn"], ["goods", "Hàng"], ["codes", "Mã khách"], ["txt", "Nhập TXT"]];
  $("tabs").innerHTML = tabs.map(([id, label]) => `<button type="button" class="${tab === id ? "on" : ""}" data-tab="${id}">${label}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => b.onclick = () => {
    if (tab === "sell") pullDraft();
    if (tab === "quote") pullQuote();
    tab = b.dataset.tab;
    sellReady = false;
    quoteReady = false;
    paint();
  });
  syncDock();
  if (tab === "sell" && sellReady && $("productList")) {
    fillProducts();
    fillCodes();
    renderCart();
    if (window.__updateTotals) window.__updateTotals();
    syncDock();
    return;
  }
  if (tab === "quote" && quoteReady && $("quoteList")) {
    fillQuoteProducts();
    fillQuoteCodes();
    renderQuoteCart();
    if (window.__updateQuoteTotals) window.__updateQuoteTotals();
    syncDock();
    return;
  }
  if (tab === "sell") renderSell();
  else if (tab === "quote") renderQuote();
  else if (tab === "orders" && $("modal").classList.contains("hidden")) renderOrders();
  else if (tab === "orders") { /* giữ phiếu đang mở */ }
  else if (tab === "goods" && $("modal").classList.contains("hidden")) renderGoods();
  else if (tab === "codes" && $("modal").classList.contains("hidden")) renderCodes();
  else if (tab === "txt" && !$("txt")) renderTxt();
}

function fillClientExtras() {

function blankPay(v) {
  const s = String(v ?? "").trim();
  if (!s) return "";
  return parseInt(s.replace(/\D/g, ""), 10) || 0;
}
function digits(v) { return Math.max(0, parseInt(String(v ?? "").replace(/\D/g, ""), 10) || 0); }
function billCore(lines, extra) {
  const subTotal = lines.reduce((s, l) => s + Number(l.qty ?? l.quantity) * Number(l.price), 0);
  const shippingFee = digits(extra.ship);
  const discount = digits(extra.discount);
  const vatFee = extra.vat ? Math.round(subTotal * 0.08) : digits(extra.vatFee);
  const finalTotal = Math.max(0, subTotal + shippingFee + (extra.vat ? vatFee : digits(extra.vatFee)) - discount);
  return { subTotal, shippingFee, vatFee: extra.vat ? vatFee : digits(extra.vatFee), discount, finalTotal };
}
function draftOrder() {
  pullDraft();
  const lines = Object.values(cart);
  const moneyPart = billCore(lines, { ship: draft.ship, discount: draft.discount, vat: draft.vat });
  return {
    orderId: nextCode(),
    clientName: (draft.clientName || "").trim() || "Khách lẻ",
    clientPhone: (draft.clientPhone || "").trim(),
    clientAddress: (draft.clientAddress || "").trim(),
    items: lines.map((l) => ({ sku: l.sku, name: l.name, unit: l.unit || "", quantity: l.qty, price: l.price, img: l.img || "", docId: l.docId || "" })),
    ...moneyPart,
    paymentMethod: draft.pay,
    paidCash: blankPay(draft.paidCash),
    paidCard: blankPay(draft.paidCard),
    note: (draft.note || "").trim(),
    status: "preview",
    createdAt: { seconds: Math.floor(Date.now() / 1000) }

}
async function saveOrder(status, printAfter) {
  const lines = Object.values(cart);
  if (!lines.length) return toast("Chưa có hàng.");
  if (saving) return;

  pullDraft();
  const clientName = (draft.clientName || "").trim() || "Khách lẻ";
  const moneyPart = billCore(lines, { ship: draft.ship, discount: draft.discount, vat: draft.vat });
  const orderId = nextCode();
  const order = {
    orderId,
    clientName,
    clientPhone: (draft.clientPhone || "").trim(),
    clientAddress: (draft.clientAddress || "").trim(),
    items: lines.map((l) => ({ sku: l.sku, name: l.name, unit: l.unit || "", quantity: l.qty, price: l.price, img: l.img || "", docId: l.docId || "" })),
    ...moneyPart,
    paymentMethod: draft.pay,
    paidCash: blankPay(draft.paidCash),
    paidCard: blankPay(draft.paidCard),
    note: (draft.note || "").trim(),
    status,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    localTimestamp: Date.now(),
    source: "hoadon.html"
  };
  try {
    await db.collection("wholesale_orders").doc(orderId).set(order);
    if (status === "completed") await deductStock(lines);
    cart = {};
    draft.note = "";
    renderCart();
    if (window.__updateTotals) window.__updateTotals();
    const msg = status === "new" ? "Đã lưu đơn chờ " + orderId : "Đã chốt " + orderId;
    if (printAfter) openPrint({ ...order, createdAt: { seconds: Math.floor(Date.now() / 1000) } }, "a4");
    toast(msg);
  } catch (err) { toast(err.message); }
  finally { saving = false; }
}
async function adjustStock(lines, sign) {
  const byDoc = {};
  for (const line of lines) {
    const qty = Number(line.qty ?? line.quantity) || 0;
    if (!qty) continue;
    const p = products.find((x) => (line.docId && x.docId === line.docId) || (line.sku && x.sku === line.sku));
    if (!p) continue;
    if (!byDoc[p.docId]) byDoc[p.docId] = { docId: p.docId, stock: parseInt(p.stock, 10) || 0, qty: 0 };
    byDoc[p.docId].qty += qty;
  }
  for (const row of Object.values(byDoc)) {
    const stock = Math.max(0, row.stock + sign * row.qty);
    await db.collection("wholesale_products").doc(row.docId).set({ stock, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    const live = products.find((x) => x.docId === row.docId);
    if (live) live.stock = stock;
  }
}
function deductStock(lines) { return adjustStock(lines, -1); }
function restoreStock(lines) { return adjustStock(lines, 1); }

  return { sub, ship, vat, discount, final: Math.max(0, sub + ship + vat - discount) };

async function syncStockEdit(before, after) {
  const net = {};
  const take = (it, sign) => {
    const qty = Number(it.quantity) || 0;
    if (!qty) return;
    const key = it.docId || it.sku || "";
    if (!key) return;
    if (!net[key]) net[key] = { docId: it.docId || "", sku: it.sku || "", qty: 0 };
    net[key].qty += sign * qty;
  };
  before.forEach((it) => take(it, -1));
  after.forEach((it) => take(it, 1));
  const deduct = [];
  const restore = [];
  Object.values(net).forEach((row) => {
    if (row.qty > 0) deduct.push(row);
    else if (row.qty < 0) restore.push({ ...row, qty: -row.qty });
  });
  if (restore.length) await restoreStock(restore);
  if (deduct.length) await deductStock(deduct);
}
async function patchOrder(complete) {
  const next = snapshotEdit();
  if (!next.items.length) return toast("Đơn cần ít nhất một dòng có số lượng.");
  if (next.items.some((it) => !it.price)) return toast("Còn dòng chưa nhập giá bán.");
  const data = {
    clientName: next.clientName,
    clientPhone: next.clientPhone || "",
    clientAddress: next.clientAddress || "",
    paymentMethod: next.paymentMethod,
    paidCash: next.paidCash,
    paidCard: next.paidCard,
    note: next.note,
    items: next.items,
    subTotal: next.subTotal,
    shippingFee: next.shippingFee,
    vatFee: next.vatFee,
    discount: next.discount || 0,
    finalTotal: next.finalTotal,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    if (complete && editDraft.status !== "completed") {
      data.status = "completed";
      data.processedAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection("wholesale_orders").doc(editDraft.docId).update(data);
      await deductStock(next.items);
      toast("Đã chốt đơn, đã trừ tồn");
    } else if (editDraft.status === "completed") {
      await syncStockEdit(editBaseItems, next.items);
      await db.collection("wholesale_orders").doc(editDraft.docId).update(data);
      toast("Đã lưu. Tồn đã chỉnh theo số lượng mới");
    } else {
      await db.collection("wholesale_orders").doc(editDraft.docId).update(data);
      toast("Đã lưu sửa đơn");
    }
    editDraft = null;
    $("modal").classList.add("hidden");
  } catch (err) { toast(err.message); }
}

function payParts(o) {
  const items = o.items || [];
  const sub = Number(o.subTotal) || items.reduce((s, it) => s + Number(it.quantity) * Number(it.price), 0);
  const ship = Number(o.shippingFee) || 0;
  const vat = Number(o.vatFee) || 0;
  const discount = Number(o.discount) || 0;
  const total = Math.max(0, sub + ship + vat - discount);
  const method = o.paymentMethod || "Tiền mặt";
  const cashSet = !(o.paidCash === "" || o.paidCash == null);
  const cardSet = !(o.paidCard === "" || o.paidCard == null);
  let cash;
  let card;
  if (!cashSet && !cardSet) {
    if (method === "Tiền mặt") { cash = total; card = 0; }
    else { cash = 0; card = total; }
  } else {
    cash = Number(o.paidCash) || 0;
    card = Number(o.paidCard) || 0;
  }
  const paid = cash + card;
  return { sub, ship, vat, discount, total, cash, card, paid, debt: Math.max(0, total - paid), method };
}

function qrUrl(orderId, amount) {
  const q = new URLSearchParams({
    amount: String(Math.max(0, Math.round(Number(amount) || 0))),
    addInfo: SHOP.note + " " + (orderId || ""),
    accountName: SHOP.owner
  });
  return "https://img.vietqr.io/image/TCB-" + SHOP.account + "-compact2.png?" + q.toString();
}
function loadImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}
function wrapLines(ctx, text, maxW) {
  const words = String(text || "").split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = "";
  for (const word of words) {
    const next = cur ? cur + " " + word : word;
    if (ctx.measureText(next).width > maxW && cur) { lines.push(cur); cur = word; }
    else cur = next;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [""];
}

  const nameLines = items.map((it) => wrapLines(measure, it.name || "", 380));
  const rowHs = nameLines.map((lines) => Math.max(52, lines.length * 30 + 16));
  measure.font = font(500, 24);
  const addr = (o.clientAddress || "").trim() || "—";
  const phone = (o.clientPhone || "").trim() || "—";
  const addrLines = wrapLines(measure, "Đ/c: " + addr, 470);
  const note = (o.note || "").trim();
  const noteLines = note ? wrapLines(measure, note, 500) : [" "];
  const tableH = 50 + rowHs.reduce((s, h) => s + h, 0);
  const metaH = 36 + 40 * 2 + Math.max(44, addrLines.length * 34) + 24;
  const payH = 9 * 48;
  const H = 380 + metaH + tableH + Math.max(payH, 180 + noteLines.length * 32 + 320) + 180;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fffdf8";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#e4c994";
  ctx.lineWidth = 12;
  ctx.strokeRect(14, 14, W - 28, H - 28);
  ctx.strokeStyle = "#c4a36a";
  ctx.lineWidth = 3;
  ctx.strokeRect(30, 30, W - 60, H - 60);
  const x0 = 52;
  if (logo) ctx.drawImage(logo, x0, 52, 150, 150);
  ctx.textAlign = "center";
  ctx.fillStyle = "#7c3527";
  ctx.font = font(700, 44);
  ctx.fillText(SHOP.name, 660, 98);
  ctx.fillStyle = "#5c5148";
  ctx.font = font(500, 24);
  let hy = 140;
  wrapLines(ctx, SHOP.address, 740).forEach((line) => { ctx.fillText(line, 660, hy); hy += 32; });
  ctx.fillText("Hotline: " + SHOP.phone, 660, hy);
  hy += 32;
  ctx.fillText(SHOP.web, 660, hy);
  ctx.textAlign = "left";
  let y = Math.max(230, hy + 28);
  ctx.strokeStyle = "#7c3527";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(W - x0, y); ctx.stroke();
  y += 54;
  ctx.fillStyle = "#7c3527";
  ctx.font = font(700, 40);
  ctx.textAlign = "center";
  ctx.fillText("HÓA ĐƠN BÁN HÀNG", W / 2, y);
  ctx.textAlign = "left";
  y += 16;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(W - x0, y); ctx.stroke();
  y += 20;
  const metaTop = y;
  ctx.fillStyle = "#fbf7f1";
  ctx.fillRect(x0, metaTop, W - x0 * 2, metaH);
  ctx.strokeStyle = "#e4d3c0";
  ctx.lineWidth = 2;
  ctx.strokeRect(x0, metaTop, W - x0 * 2, metaH);
  ctx.fillStyle = "#2b211c";
  ctx.font = font(600, 26);
  const date = when(o.createdAt) || when({ seconds: Math.floor(Date.now() / 1000) });
  let my = metaTop + 42;
  ctx.fillText("Số hóa đơn: " + (o.orderId || ""), x0 + 20, my);
  ctx.fillText("Ngày: " + date, 560, my);
  my += 40;
  ctx.fillText("Khách hàng: " + (o.clientName || "Khách lẻ"), x0 + 20, my);
  ctx.fillText("Thu ngân: " + SHOP.cashier, 560, my);
  my += 40;
  ctx.fillText("SĐT: " + phone, x0 + 20, my);
  addrLines.forEach((line, i) => ctx.fillText(line, 560, my + i * 34));
  y = metaTop + metaH + 22;
  const cols = [70, 410, 108, 96, 164, 160];
  const tableW = cols.reduce((s, n) => s + n, 0);
  const colX = (i) => { let x = x0; for (let k = 0; k < i; k++) x += cols[k]; return x; };
  const drawRow = (ry, h, fill) => {
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(x0, ry, tableW, h); }
    ctx.strokeStyle = "#7a5436";
    ctx.lineWidth = 1.6;
    ctx.strokeRect(x0, ry, tableW, h);
    ctx.beginPath();
    for (let i = 1; i < cols.length; i++) { const x = colX(i); ctx.moveTo(x, ry); ctx.lineTo(x, ry + h); }
    ctx.stroke();
  };
  drawRow(y, 48, "#f6efe4");
  ctx.fillStyle = "#5c3a28";
  ctx.font = font(700, 22);
  ctx.textAlign = "center";
  ["STT", "Tên hàng hóa", "ĐVT", "SL", "Đơn giá", "Thành tiền"].forEach((label, i) => {
    ctx.fillText(label, colX(i) + cols[i] / 2, y + 31);
  });
  y += 48;
  items.forEach((it, i) => {
    const h = rowHs[i];
    drawRow(y, h, i % 2 ? "#fffdf8" : "#fbf7f1");
    ctx.fillStyle = "#2b211c";
    ctx.font = font(600, 24);
    ctx.textAlign = "center";
    ctx.fillText(String(i + 1), colX(0) + cols[0] / 2, y + 32);
    ctx.textAlign = "left";
    nameLines[i].forEach((line, li) => ctx.fillText(line, colX(1) + 12, y + 32 + li * 30));
    ctx.textAlign = "center";
    ctx.font = font(500, 22);
    ctx.fillText(it.unit || "—", colX(2) + cols[2] / 2, y + 32);
    ctx.font = font(600, 24);
    ctx.fillText(String(it.quantity), colX(3) + cols[3] / 2, y + 32);
    ctx.textAlign = "right";
    ctx.fillText(money(it.price), colX(4) + cols[4] - 12, y + 32);
    ctx.fillText(money(Number(it.quantity) * Number(it.price)), colX(5) + cols[5] - 12, y + 32);
    y += h;
  });
  ctx.textAlign = "left";
  y += 26;
  const footTop = y;
  ctx.fillStyle = "#2b211c";
  ctx.font = font(700, 26);
  const qty = items.reduce((s, it) => s + Number(it.quantity || 0), 0);
  ctx.fillText("Tổng SL mua: " + qty, x0, y + 8);
  ctx.fillText("Khuyến mãi HĐ: " + money(pay.discount), x0, y + 46);
  ctx.fillText("Ghi chú:", x0, y + 90);
  ctx.font = font(500, 24);
  noteLines.forEach((line, i) => ctx.fillText(line, x0, y + 126 + i * 32));
  const qr = await loadImage(qrUrl(o.orderId, pay.total));
  const qrY = y + 140 + noteLines.length * 32;
  ctx.strokeStyle = "#e4d3c0";
  ctx.lineWidth = 2;
  ctx.strokeRect(x0, qrY, 530, 270);
  if (qr) ctx.drawImage(qr, x0 + 14, qrY + 16, 230, 230);
  ctx.fillStyle = "#2b211c";
  ctx.font = font(700, 26);
  ctx.fillText("QR thanh toán", x0 + 260, qrY + 48);
  ctx.font = font(500, 23);
  [SHOP.bank, "STK: " + SHOP.account, SHOP.owner].forEach((line, i) => ctx.fillText(line, x0 + 260, qrY + 92 + i * 34));
  wrapLines(ctx, "Nội dung: " + SHOP.note + " " + (o.orderId || ""), 250).forEach((line, i) => ctx.fillText(line, x0 + 260, qrY + 196 + i * 30));
  const px = 620;
  const pw = W - x0 - px;
  const labels = [
    ["Tiền hàng", pay.sub, ""],
    ["Ship", pay.ship, ""],
    ["VAT", pay.vat, ""],
    ["Khuyến mãi", pay.discount, ""],
    ["Tổng thanh toán", pay.total, "grand"],
    ["Khách trả", pay.paid, ""],
    ["Tiền mặt", pay.cash, ""],
    ["Thẻ/CK", pay.card, ""],
    ["Còn nợ", pay.debt, pay.debt ? "neg" : ""]
  ];
  labels.forEach((row, i) => {
    const ry = footTop + i * 48;
    ctx.fillStyle = row[2] === "grand" ? "#f8f1e7" : "#fffdf8";
    ctx.fillRect(px, ry, pw, 48);
    ctx.strokeStyle = "#7a5436";
    ctx.lineWidth = 1.6;
    ctx.strokeRect(px, ry, pw, 48);
    ctx.beginPath();
    ctx.moveTo(px + pw * 0.56, ry);
    ctx.lineTo(px + pw * 0.56, ry + 48);
    ctx.stroke();
    ctx.font = font(row[2] ? 700 : 600, row[2] === "grand" ? 22 : 21);
    ctx.fillStyle = row[2] === "neg" ? "#9b2c2c" : row[2] === "grand" ? "#7c3527" : "#5c5148";
    ctx.textAlign = "left";
    ctx.fillText(row[0], px + 12, ry + 31);
    ctx.textAlign = "right";
    ctx.fillStyle = row[2] === "grand" ? "#7c3527" : row[2] === "neg" ? "#9b2c2c" : "#2b211c";
    ctx.fillText(money(row[1]), px + pw - 12, ry + 31);
  });
  const thanksY = Math.max(qrY + 310, footTop + labels.length * 48 + 46);
  ctx.textAlign = "center";
  ctx.fillStyle = "#6f655c";
  ctx.font = font(500, 24);
  [
    "Xin cảm ơn Quý khách đã mua hàng tại " + SHOP.name + "!",
    "Vui lòng kiểm tra hóa đơn trước khi thanh toán.",
    "Hàng đã mua vui lòng không đổi trả."
  ].forEach((line, i) => ctx.fillText(line, W / 2, Math.min(thanksY + i * 34, H - 48)));
  return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
}

async function showZalo(o) {
  if (!(o.items || []).length) return toast("Chưa có hàng.");
  const host = $("printSheet");
  host.classList.remove("hidden");
  host.innerHTML = `<div class="sheet" style="text-align:center"><p>Đang tạo ảnh gửi Zalo…</p></div>`;
  try {
    const blob = await invoiceBlob(o);
    if (!blob) throw new Error("Không tạo được ảnh");
    const url = URL.createObjectURL(blob);
    const file = new File([blob], "HoaDon-" + (o.orderId || "mimi") + ".png", { type: "image/png" });
    host.innerHTML = `<div class="sheet" style="text-align:center">
      <div class="row" style="justify-content:space-between"><strong>Ảnh gửi khách</strong><button class="btn ghost" id="xZalo" type="button">Đóng</button></div>
      <p class="meta">Bấm Gửi Zalo để chọn Zalo. Hoặc nhấn giữ ảnh để lưu.</p>
      <img class="zalo-shot" alt="Hóa đơn" src="${url}">
      <div class="row" style="margin-top:12px;justify-content:center">
        <button class="btn" id="shareZalo" type="button">Gửi Zalo</button>
        <button class="btn soft" id="saveZalo" type="button">Tải ảnh</button>
      </div>
    </div>`;
    $("xZalo").onclick = () => { URL.revokeObjectURL(url); host.classList.add("hidden"); };
    $("saveZalo").onclick = () => { const a = document.createElement("a"); a.href = url; a.download = file.name; a.click(); };
    $("shareZalo").onclick = async () => {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "Hóa đơn " + (o.orderId || ""), text: SHOP.name + " - " + (o.clientName || "") }); }
        catch (err) { if (err.name !== "AbortError") toast(err.message); }
      } else {
        $("saveZalo").click();
        toast("Đã tải ảnh. Mở Zalo và gửi file này.");
      }
    };
  } catch (err) {
    host.classList.add("hidden");
    toast(err.message || "Không tạo được ảnh");
  }
}

function pullQuote() {
  if (!$("qClient")) return;
  quoteDraft.clientName = $("qClient").value;
  quoteDraft.clientPhone = $("qPhone").value;
  quoteDraft.clientAddress = $("qAddress").value;
  quoteDraft.note = $("qNote").value;
  quoteDraft.validDays = $("qDays").value || "7";
  quoteDraft.vat = $("qVat").checked;
  if ($("qSign")) quoteDraft.signRole = $("qSign").value;
}
function quoteCode() {
  const b = vnParts(new Date());
  return "BG" + b.year + b.month + b.day + b.hour + b.minute;
}
function quoteUntil(days) {
  const n = Math.max(1, parseInt(days, 10) || 7);
  const b = vnParts(new Date(Date.now() + n * 86400000));
  return `${b.day}/${b.month}/${b.year}`;
}
function quoteMoney(lines, vatOn) {
  const sub = lines.reduce((s, l) => s + Number(l.qty ?? l.quantity) * Number(l.price), 0);
  const vat = vatOn ? Math.round(sub * 0.08) : 0;
  return { sub, vat, total: sub + vat };
}
function buildQuote() {
  pullQuote();
  const lines = Object.values(quoteCart);
  const moneyPart = quoteMoney(lines, quoteDraft.vat);
  const days = String(quoteDraft.validDays || "7");
  return {
    kind: "quote",
    orderId: quoteCode(),
    clientName: (quoteDraft.clientName || "").trim() || "Quý khách",
    clientPhone: (quoteDraft.clientPhone || "").trim(),
    clientAddress: (quoteDraft.clientAddress || "").trim(),
    items: lines.map((l) => ({ sku: l.sku, name: l.name, unit: l.unit || "cây", quantity: l.qty, price: l.price, img: l.img || "" })),
    subTotal: moneyPart.sub,
    vatFee: moneyPart.vat,
    vatOn: !!quoteDraft.vat,
    finalTotal: moneyPart.total,
    validDays: days,
    validUntil: quoteUntil(days),
    note: (quoteDraft.note || "").trim(),
    signRole: quoteDraft.signRole == null ? "GIÁM ĐỐC" : quoteDraft.signRole,
    createdAt: { seconds: Math.floor(Date.now() / 1000) }
  };
}

  const list = $("quoteCodes");

function fillQuoteClient() {
  const name = ($("qClient").value || "").trim();
  const c = codes.find((x) => (x.clientName || "") === name || x.id === name);
  if (!c) return;
  if ((c.phone || c.clientPhone || c.sdt) && !$("qPhone").value) $("qPhone").value = c.phone || c.clientPhone || c.sdt;
  if ((c.address || c.clientAddress || c.diaChi) && !$("qAddress").value) $("qAddress").value = c.address || c.clientAddress || c.diaChi;
  pullQuote();
}
function fillQuoteProducts() {
  const box = $("quoteList");
  if (!box) return;
  const rows = products.filter((p) => p.isActive !== false && hit(`${p.name} ${p.sku} ${p.category}`, qQuote)).slice(0, 80);
  if (!rows.length) {
    box.innerHTML = `<div class="pad meta">${!cloudOk ? "Đang tải hàng từ Firebase…" : (qQuote ? "Không thấy hàng." : "Kho chưa có hàng.")}</div>`;

function addQuote(docId) {
  const p = products.find((x) => x.docId === docId);
  if (!p) return;
  if (quoteCart[p.docId]) {
    quoteCart[p.docId].qty += 1;
    renderQuoteCart();
    window.__updateQuoteTotals?.();
    toast("Đã tăng số lượng.");
    return;
  }
  openQuotePrice(p);
}

async function quoteBlob(q) {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const W = 1080;
  const items = q.items || [];
  const font = (weight, size) => weight + " " + size + "px 'Be Vietnam Pro', sans-serif";
  const measure = document.createElement("canvas").getContext("2d");
  measure.font = font(600, 28);
  const nameLines = items.map((it) => wrapLines(measure, it.name || "", 560));
  const rowHs = nameLines.map((lines) => Math.max(64, lines.length * 36 + 24));
  const tableH = 56 + rowHs.reduce((s, h) => s + h, 0);
  const note = (q.note || "").trim();
  measure.font = font(500, 24);
  const noteLines = note ? wrapLines(measure, note, 900) : [];
  const H = 520 + tableH + 280 + noteLines.length * 34;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fbf8f3";
  ctx.fillRect(0, 0, W, H);
  const band = ctx.createLinearGradient(0, 0, W, 0);
  band.addColorStop(0, "#7c3527");
  band.addColorStop(0.55, "#a68456");
  band.addColorStop(1, "#f3e2c4");
  ctx.fillStyle = band;
  ctx.fillRect(0, 0, W, 18);
  ctx.strokeStyle = "#e4c994";
  ctx.lineWidth = 2;
  ctx.strokeRect(28, 40, W - 56, H - 68);
  ctx.textAlign = "center";
  ctx.fillStyle = "#a68456";
  ctx.font = font(700, 18);
  ctx.fillText("HOA LỤA TRANG TRÍ", W / 2, 78);
  ctx.fillStyle = "#7c3527";
  ctx.font = font(700, 36);
  ctx.fillText("CÔNG TY TNHH HOA LỤA VÂN VƯỢNG", W / 2, 124);
  ctx.fillStyle = "#6f655c";
  ctx.font = font(500, 22);
  ctx.fillText("MST: 0110660048", W / 2, 162);
  ctx.fillText("Số 472 Thụy Khuê, Phường Tây Hồ, Thành phố Hà Nội", W / 2, 194);
  ctx.fillText("Điện thoại: 0376 570 953", W / 2, 226);
  ctx.fillStyle = "#7c3527";
  ctx.font = font(700, 54);
  ctx.fillText("BÁO GIÁ", W / 2, 300);
  ctx.font = font(500, 22);
  ctx.fillStyle = "#6f655c";
  ctx.fillText("Kính gửi Quý khách. Đơn giá chưa gồm VAT.", W / 2, 338);
  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  ctx.fillRect(52, 364, W - 104, 110);
  ctx.strokeStyle = "#eadfce";
  ctx.strokeRect(52, 364, W - 104, 110);
  ctx.fillStyle = "#1c1915";
  ctx.font = font(600, 24);
  ctx.fillText("Kính gửi: " + (q.clientName || "Quý khách"), 72, 404);
  ctx.fillText("Số: " + (q.orderId || ""), 620, 404);
  ctx.fillText("Ngày: " + (when(q.createdAt) || ""), 72, 446);
  ctx.fillText("Hiệu lực đến: " + (q.validUntil || ""), 620, 446);
  let y = 500;
  const cols = [620, 90, 150, 168];
  const x0 = 52;
  const tableW = cols.reduce((s, n) => s + n, 0);
  const colX = (i) => { let x = x0; for (let k = 0; k < i; k++) x += cols[k]; return x; };
  ctx.fillStyle = "#7c3527";
  ctx.fillRect(x0, y, tableW, 52);
  ctx.fillStyle = "#fff8f3";
  ctx.font = font(700, 22);
  ctx.textAlign = "center";
  ["Hàng hóa", "SL", "Đơn giá", "Thành tiền"].forEach((label, i) => ctx.fillText(label, colX(i) + cols[i] / 2, y + 33));
  y += 52;
  items.forEach((it, i) => {
    const h = rowHs[i];
    ctx.fillStyle = i % 2 ? "#fff" : "#fbf8f3";
    ctx.fillRect(x0, y, tableW, h);
    ctx.strokeStyle = "#eadfce";
    ctx.strokeRect(x0, y, tableW, h);
    ctx.fillStyle = "#1c1915";
    ctx.font = font(600, 26);
    ctx.textAlign = "left";
    nameLines[i].forEach((line, li) => ctx.fillText(line, colX(0) + 16, y + 36 + li * 34));
    ctx.textAlign = "center";
    ctx.fillText(String(it.quantity), colX(1) + cols[1] / 2, y + 36);
    ctx.textAlign = "right";
    ctx.fillText(money(it.price), colX(2) + cols[2] - 16, y + 36);
    ctx.fillText(money(Number(it.quantity) * Number(it.price)), colX(3) + cols[3] - 16, y + 36);
    y += h;
  });
  y += 28;
  const boxW = 460;
  const boxX = W - 52 - boxW;
  const rows = [
    ["Tiền hàng", money(q.subTotal) + " đ", "#fff"],
    ["VAT 8%", money(q.vatFee) + " đ", "#fff6ea"],
    ["Tổng cộng", money(q.finalTotal) + " đ", "#7c3527"]
  ];
  rows.forEach((row, i) => {
    ctx.fillStyle = row[2];
    ctx.fillRect(boxX, y + i * 58, boxW, 58);
    ctx.fillStyle = i === 2 ? "#fff8f3" : "#7c3527";
    ctx.font = font(700, i === 2 ? 28 : 24);
    ctx.textAlign = "left";
    ctx.fillText(row[0], boxX + 18, y + i * 58 + 37);
    ctx.textAlign = "right";
    ctx.fillText(row[1], boxX + boxW - 18, y + i * 58 + 37);
  });
  ctx.textAlign = "left";
  ctx.fillStyle = "#6f655c";
  ctx.font = font(500, 22);
  let ny = y + 24;
  noteLines.forEach((line) => { ctx.fillText(line, 64, ny); ny += 32; });
  ctx.fillText(q.vatOn ? "Đơn giá chưa gồm VAT. VAT 8% cộng riêng." : "Báo giá này chưa tính VAT.", 64, ny + 8);
  ctx.textAlign = "center";
  ctx.fillText("Xin cảm ơn Quý khách.", W / 2, H - 52);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
}
async function showQuoteFile(q) {

    host.innerHTML = `<div class="sheet" style="text-align:center">

      </div>

    $("xQuoteFile").onclick = () => { URL.revokeObjectURL(url); host.classList.add("hidden"); };

  } catch (err) {
    host.classList.add("hidden");
    toast(err.message || "Không tạo được ảnh");

}

    <label class="lbl">Màu / khối lượng</label><div class="row"><input class="field" id="mColor" value="${esc(v.color || "")}"><input class="field" id="mWeight" value="${esc(v.weight || "")}"></div>
    <label class="lbl">Mô tả</label><textarea class="area" id="mDesc">${esc(v.description || "")}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="saveP" type="button">Lưu</button>${p ? `<button class="btn bad" id="delP" type="button">Xóa</button>` : ""}</div>
  </div>`;
  $("x").onclick = () => $("modal").classList.add("hidden");
  $("saveP").onclick = async () => {
    const name = $("mName").value.trim();
    if (!name) return toast("Cần tên hàng");
    const price = parseInt($("mPrice").value.replace(/\D/g, ""), 10) || 0;
    const data = {
      name, sku: $("mSku").value.trim(), category: $("mCat").value.trim() || "Hoa lụa",
      price, wholesale_price: price, stock: parseInt($("mStock").value, 10) || 0,
      image: $("mImg").value.trim(), image_url: $("mImg").value.trim(),
      color: $("mColor").value.trim(), weight: $("mWeight").value.trim(),
      description: $("mDesc").value.trim(), isActive: true,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    try {
      if (p) await db.collection("wholesale_products").doc(p.docId).set(data, { merge: true });
      else {
        data.is_new = true;
        await db.collection("wholesale_products").add(data);
      }
    } catch (err) { return toast(err.message); }
    $("modal").classList.add("hidden");
    toast("Đã lưu hàng");
  };
  const del = $("delP");
  if (del) del.onclick = async () => {
    if (!confirm("Xóa hàng này trên Firebase?")) return;
    await db.collection("wholesale_products").doc(p.docId).delete();
    $("modal").classList.add("hidden");
  };
}

function renderCodes() {
  $("view").innerHTML = `
    <div class="card pad">
      <strong>Mã khách sỉ</strong>
      <p class="meta">Khách nhập mã này ở bảng hàng. Hóa đơn lấy tên khách từ đây.</p>
      <div class="row">
        <input class="field" id="newCode" placeholder="Mã, ví dụ 123456">
        <input class="field" id="newClient" placeholder="Tên khách">
        <button class="btn" id="addCode" type="button">Tạo</button>
      </div>
    </div>
    <div class="card" style="margin-top:8px">${codes.map((c) => `
      <div class="item"><span class="grow"><b>${esc(c.clientName || "Chưa đặt tên")}</b><div class="meta">Mã ${esc(c.id)} · hết hạn ${esc(when(c.expiresAt) || "không ghi")}</div></span>
      <button class="btn bad" type="button" data-code="${esc(c.id)}">Xóa</button></div>`).join("") || `<div class="pad meta">Chưa có mã.</div>`}
    </div>`;
  $("addCode").onclick = async () => {
    const id = $("newCode").value.trim();
    const clientName = $("newClient").value.trim();
    if (!id || !clientName) return toast("Cần mã và tên khách");
    const expires = new Date(); expires.setDate(expires.getDate() + 30);
    await db.collection("access_codes").doc(id).set({
      clientName,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      expiresAt: firebase.firestore.Timestamp.fromDate(expires)

  $("view").querySelectorAll("[data-code]").forEach((b) => b.onclick = async () => {
    if (!confirm("Xóa mã " + b.dataset.code + "?")) return;
    await db.collection("access_codes").doc(b.dataset.code).delete();

}

function renderTxt() {
  $("view").innerHTML = `
    <div class="card pad">
      <strong>Nhập TXT vào sổ sỉ</strong>
      <p class="meta">Đơn giá trong TXT là nghìn đồng (56 = 56.000đ). Không tự thêm ship, VAT, chiết khấu. Đơn nhập được ghi trạng thái đã chốt, không trừ tồn.</p>
      <textarea class="area" id="txt" style="min-height:180px" placeholder="Hóa đơn 1 - Tên khách&#10;Sản phẩm  Số lượng  Đơn giá  Thành tiền&#10;bó tuy líp  30  56  1.680&#10;Tổng hóa đơn: 1.680"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="readTxt" type="button">Đọc</button><button class="btn" id="commitTxt" type="button" disabled>Ghi Firebase</button></div>
      <div id="txtOut"></div>
    </div>`;
  let parsed = [];
  $("readTxt").onclick = () => {
    parsed = parseTxt($("txt").value);
    const ok = parsed.length && parsed.every((inv) => inv.ok);
    $("commitTxt").disabled = !ok;
    $("txtOut").innerHTML = parsed.length ? parsed.map((inv) => `
      <div class="card pad" style="margin-top:8px">
        <b>${esc(inv.title)}</b> <span class="pill ${inv.ok ? "ok" : "bad"}">${inv.ok ? "Khớp số" : "Lệch số"}</span>
        <div class="meta">Khách: ${esc(inv.customer)} · tổng ${money(inv.sum)}</div>
        ${inv.lines.map((l) => `<div class="row" style="justify-content:space-between"><span>${esc(l.name)} · ${l.qty} × ${money(l.price)}</span><b>${money(l.total)}</b></div>`).join("")}
      </div>`).join("") : `<p class="meta">Không tách được hóa đơn.</p>`;
  };
  $("commitTxt").onclick = async () => {
    $("commitTxt").disabled = true;
    for (const inv of parsed) {
      const orderId = nextCode();
      const items = inv.lines.map((l) => {
        const found = products.find((p) => fold(p.name) === fold(l.name));
        return { sku: found?.sku || "", name: l.name, quantity: l.qty, price: l.price, img: found ? imgOf(found) : "", docId: found?.docId || "" };
      });
      const order = {
        orderId, clientName: inv.customer || "Khách lẻ", items,
        subTotal: inv.sum, shippingFee: 0, vatFee: 0, finalTotal: inv.sum,
        paymentMethod: "Tiền mặt",
        note: `${inv.title} | Nhập TXT`,
        status: "completed",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        localTimestamp: Date.now(),
        source: "txt"
      };
      await db.collection("wholesale_orders").doc(orderId).set(order);
      orders.push(order);
    }
    toast("Đã ghi " + parsed.length + " hóa đơn");
    tab = "orders";
    paint();
  };
}
function parseThousand(text) {
  const digits = String(text).replace(/[^\d]/g, "");
  return digits ? parseInt(digits, 10) * 1000 : 0;
}
function parseTxt(text) {
  const invoices = [];
  let cur = null;
  let auto = 1;
  const push = () => {
    if (!cur || !cur.lines.length) { cur = null; return; }
    const sum = cur.lines.reduce((s, l) => s + l.total, 0);
    const ok = cur.lines.every((l) => l.qty * l.price === l.total) && (!cur.expected || cur.expected === sum);
    invoices.push({ ...cur, sum, ok });
    cur = null;
  };
  for (const raw of text.replace(/^\uFEFF/, "").split(/\r?\n/)) {
    const line = raw.replace(/\s+/g, " ").trim();
    const head = line.match(/^(?:Hóa đơn|Hoa don)\s*(.*)$/i);
    if (head) {
      push();
      const tail = (head[1] || "").trim();
      let no = auto, customer = "Khách lẻ";
      const numbered = tail.match(/^(\d+)(?:\s*[-:–—]?\s*(.*))?$/);
      if (numbered) { no = parseInt(numbered[1], 10); customer = (numbered[2] || "").trim() || "Khách lẻ"; }
      else if (tail) customer = tail.replace(/^(?:gửi|gui|khách|khach|cho)\s+/i, "").trim();
      auto = Math.max(auto + 1, no + 1);
      cur = { no, title: "Hóa đơn " + no, customer, lines: [], expected: 0 };
      continue;
    }
    if (!cur) continue;
    const total = line.match(/^(?:Tổng hóa đơn|Tong hoa don)(?:\s+\d+)?\s*:\s*([\d.,]+)/i);
    if (total) { cur.expected = parseThousand(total[1]); continue; }
    if (!line || /^sản phẩm|^san pham/i.test(line)) continue;
    const tokens = line.split(" ");
    const nums = tokens.map((t, i) => /^\d+(?:[.,]\d+)?$/.test(t) ? i : -1).filter((i) => i >= 0);
    if (nums.length >= 3) {
      const iQty = nums[nums.length - 3];
      const name = tokens.slice(0, iQty).join(" ").trim();
      if (!name) continue;
      const qty = parseFloat(tokens[iQty].replace(",", ".")) || 0;
      const price = parseThousand(tokens[nums[nums.length - 2]]);
      const lineTotal = parseThousand(tokens[nums[nums.length - 1]]);
      cur.lines.push({ name, qty, price, total: lineTotal });
    }
  }
  push();
  return invoices;
}

$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.add("hidden"); });
paint();
watch();
